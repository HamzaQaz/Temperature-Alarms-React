<text x="297" y="466" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">3V3</text>
<rect x="560" y="140" width="110" height="180" rx="6" fill="#1e88e5" stroke="#0d47a1" stroke-width="2"/>
<line x1="572" y1="150" x2="572" y2="250" stroke="#0d47a1" stroke-width="1" opacity="0.6"/>
<line x1="584" y1="150" x2="584" y2="250" stroke="#0d47a1" stroke-width="1" opacity="0.6"/>
