<rect x="275" y="120" width="12" height="12" fill="#d4a017" stroke="#8a6a0e"/>
<text x="297" y="130" fill="#333" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">D2</text>
