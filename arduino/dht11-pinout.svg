<text x="143" y="354" text-anchor="end" fill="#333">3V3</text>
<rect x="153" y="372" width="12" height="12" fill="#d4a017" stroke="#8a6a0e"/>
<text x="143" y="382" text-anchor="end" fill="#333">EN</text>
