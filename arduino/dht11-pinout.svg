<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
<title>NodeMCU (ESP8266) wired to a DHT11: DATA on GPIO 5 (D1), VCC on 3V3, GND on GND</title>
<rect width="760" height="560" fill="#ffffff"/>
<text x="20" y="32" font-size="18" font-weight="600" fill="#111">NodeMCU + DHT11 wiring</text>
<text x="20" y="50" fill="#555">Top view, USB at the bottom. Data on GPIO 5 (D1), power from 3V3.</text>
