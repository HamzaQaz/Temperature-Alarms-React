<text x="615" y="290" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">DHT11</text>
<text x="615" y="306" text-anchor="middle" fill="#e3f2fd" font-size="10">bare four-pin sensor</text>
<rect x="520" y="167" width="40" height="6" fill="#b0bec5" stroke="#78909c"/>
<text x="676" y="174" fill="#333" font-weight="600">VCC</text>
<rect x="520" y="207" width="40" height="6" fill="#b0bec5" stroke="#78909c"/>
<text x="676" y="214" fill="#333" font-weight="600">DATA</text>
<rect x="520" y="247" width="40" height="6" fill="#b0bec5" stroke="#78909c"/>
<text x="676" y="254" fill="#333" font-weight="600">NC</text>
<rect x="520" y="287" width="40" height="6" fill="#b0bec5" stroke="#78909c"/>
<text x="676" y="294" fill="#333" font-weight="600">GND</text>
<g transform="translate(330,360)">
<rect x="0" y="0" width="410" height="70" rx="6" fill="#f5f5f5" stroke="#ddd"/>
<line x1="14" y1="18" x2="44" y2="18" stroke="#e0a800" stroke-width="3"/>
<text x="54" y="22" fill="#333">D1 (GPIO 5) → DATA</text>
<line x1="14" y1="38" x2="44" y2="38" stroke="#c62828" stroke-width="3"/>
<text x="54" y="42" fill="#333">3V3 → VCC</text>
<line x1="14" y1="58" x2="44" y2="58" stroke="#212121" stroke-width="3"/>
<text x="54" y="62" fill="#333">GND → GND</text>
</g>
<g transform="translate(330,444)" fill="#333">
<text x="0" y="0" font-weight="600">Pull-up</text>
<text x="0" y="18">A bare four-pin DHT11 needs a 10 kΩ resistor between DATA and</text>
<text x="0" y="34">VCC, as drawn, or every read comes back NaN. Three-pin modules</text>
<text x="0" y="50">carry that resistor on the board: wire VCC, DATA, and GND the same</text>
<text x="0" y="66">way and check the silkscreen, since the pin order varies by module.</text>
<text x="0" y="92" fill="#666">Power from 3V3, never VIN. Leave NC unconnected.</text>
</g>
</svg>
