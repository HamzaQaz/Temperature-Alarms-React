# Security headers for every response nginx sends (frontend/nginx.conf includes this file).
# add_header in a location replaces every one inherited from the server block, so each location
# that adds its own header includes this file again; nginx 1.28 has no add_header_inherit.
#
# style-src needs 'unsafe-inline': Radix and Recharts set style attributes, and the chart writes
# a <style> element. No inline script exists, so script-src stays 'self'. connect-src 'self'
# covers fetch and the SSE stream, which are same-origin (docs/adr/0005).
# No Strict-Transport-Security: this server is plain HTTP. Add it at the TLS proxy in front.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
