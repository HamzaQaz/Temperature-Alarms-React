# The web service of the root compose.yaml: the built frontend plus the /api/ proxy, on
# plain HTTP. Put TLS in front of the stack, not inside it (DEPLOYMENT.md).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose's DNS. Resolving at request time lets nginx keep running while api is down
    # and follow api to a new address after `docker compose up --build` recreates it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3001;

    # Backend API, including the SSE stream. ^~ so no asset rule below can outrank it.
    location ^~ /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used, so the backend's same-origin check
        # can match it against the Origin header without a CORS_ORIGIN setting.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Server-Sent Events: no buffering, long read timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # React Router: every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
