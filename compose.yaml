# The whole system on one port (docs/adr/0005): `cp .env.example .env`, fill in the three
# secrets, then `docker compose up -d --build`. The database is a named volume, so data
# survives `down`; `down -v` wipes it. See DEPLOYMENT.md.
#
# backend/docker-compose.yml is unrelated: it is the throwaway database for `npm test`.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # No binary log: nothing replicates from it and there is no point-in-time recovery; backups are
    # deploy.sh's mysqldump files. The log cost a second fsync per Reading and about 3 GB on disk at
    # 100 Devices. A 512 MB buffer pool holds the week the Campuses overview reads; MySQL's 128 MB
    # default made it 3.5 times slower at 90 days (DEPLOYMENT.md, Sizing).
    command: ["--disable-log-bin", "--innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-512M}"]
    environment:
      MYSQL_DATABASE: temperature_alarms
      MYSQL_USER: temperature
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (openssl rand -hex 32)}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      # root only through the socket inside this container (deploy.sh's backups and restores, the
      # commands in DEPLOYMENT.md), never over the network: the root password is DB_PASSWORD, which
      # api holds too. The image's default is root@'%'. Applies when the volume is first created.
      MYSQL_ROOT_HOST: localhost
    volumes:
      - db-data:/var/lib/mysql
    # The entrypoint chowns the data directory and drops to the mysql user; nothing else is needed.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    # Not published: only api reaches it. Use `docker compose exec db mysql ...` from the host.
    # No password: `mysqladmin ping` exits 0 whenever the server answers, access denied included,
    # and 1 when nothing listens. Over TCP, so the entrypoint's socket-only first start is not taken
    # for the real one. A password here would sit on a command line the host's `ps` shows every 5 s.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uhealthcheck", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    # Exactly one instance (docs/adr/0001): SSE fan-out and the rate limit live in memory.
    # No CORS_ORIGIN: the browser reaches /api/ on the page's own origin through web.
    environment:
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: temperature
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: temperature_alarms
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env (openssl rand -hex 32)}
      DEVICE_TOKEN: ${DEVICE_TOKEN:?Set DEVICE_TOKEN in .env (openssl rand -hex 32)}
      REPORT_INTERVAL_SECONDS: ${REPORT_INTERVAL_SECONDS:-30}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      HOT_WARNING_F: ${HOT_WARNING_F:-82}
      HOT_CRITICAL_F: ${HOT_CRITICAL_F:-90}
      COLD_WARNING_F: ${COLD_WARNING_F:-50}
      DRY_WARNING_PERCENT: ${DRY_WARNING_PERCENT:-20}
      MISSED_REPORTS_BEFORE_OFFLINE: ${MISSED_REPORTS_BEFORE_OFFLINE:-3}
      LEGACY_TIME_ZONE: ${LEGACY_TIME_ZONE:-}
    depends_on:
      db:
        condition: service_healthy
    # It writes nothing to disk: the image is read-only and holds no capabilities.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Not published: web proxies /api/ to it.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    # nginx runs as non-root inside, on 8080; the host port is unchanged.
    ports:
      - "${WEB_PORT:-80}:8080"
    # Empty: clients are the addresses nginx sees. Behind a TLS proxy, the proxy's address(es),
    # comma-separated, or `gateway` for a proxy on this host (DEPLOYMENT.md, TLS in front).
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-}
    depends_on:
      api:
        condition: service_healthy
    # nginx-unprivileged keeps its pid and temp files under /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

volumes:
  db-data:
